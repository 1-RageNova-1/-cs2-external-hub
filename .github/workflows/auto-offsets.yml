name: Auto Offsets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull a2x dump and write offsets.json
        run: |
          python3 << 'PY'
          import json, urllib.request, os
          from datetime import datetime, timezone

          OFFSETS_URL = "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.json"
          CLIENT_URL = "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/client_dll.json"
          INFO_URL = "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/info.json"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "RageNova-offset-sync"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode()

          offsets = json.loads(get(OFFSETS_URL))
          client = json.loads(get(CLIENT_URL))
          try:
              info = json.loads(get(INFO_URL))
              build = info.get("build_number") or info.get("build") or info.get("timestamp") or "unknown"
          except Exception:
              build = "unknown"

          client_dll = offsets.get("client.dll") or offsets.get("client_dll") or {}
          dw_view = client_dll.get("dwViewAngles")
          if dw_view is None:
              raise SystemExit("dwViewAngles missing from a2x offsets.json")

          classes = (client.get("client.dll") or client).get("classes") or {}
          def field(cls, name):
              c = classes.get(cls) or {}
              f = (c.get("fields") or {}).get(name) or {}
              return f.get("offset")

          m_id = field("C_CSPlayerPawn", "m_iIDEntIndex")
          m_punch = field("C_CSPlayerPawn", "m_aimPunchAngle")
          if m_punch is None:
              m_punch = field("C_CSPlayerPawnBase", "m_aimPunchAngle")

          out = {
              "build": build,
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "a2x/cs2-dumper",
              "dwViewAngles": hex(int(dw_view)) if not isinstance(dw_view, str) else dw_view,
          }
          if m_id is not None:
              out["m_iIDEntIndex"] = hex(int(m_id))
          if m_punch is not None:
              out["m_aimPunchAngle"] = hex(int(m_punch))

          path = "offsets.json"
          old = None
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  old = f.read().strip()
          new = json.dumps(out, indent=2) + "\n"

          def core(s):
              try:
                  j = json.loads(s)
                  j.pop("updated", None)
                  return json.dumps(j, sort_keys=True)
              except Exception:
                  return s

          env_path = os.environ.get("GITHUB_ENV", "")
          if old is not None and core(old) == core(new):
              print("no offset change")
              if env_path:
                  open(env_path, "a").write("CHANGED=0\n")
          else:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new)
              print("wrote", path)
              print(new)
              if env_path:
                  open(env_path, "a").write("CHANGED=1\n")
          PY

      - name: Commit if changed
        if: env.CHANGED == '1'
        run: |
          git config user.name "RageNova Bot"
          git config user.email "bot@ragenova.local"
          git add offsets.json
          git commit -m "chore: sync offsets from a2x/cs2-dumper"
          git push
